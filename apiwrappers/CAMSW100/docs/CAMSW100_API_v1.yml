api_info:
  name: "CAMSW100 Device API"
  version: "1.0"
  device_model: "CAMSW100-000"
  firmware_version: "V1.3.1 or later"
  connection_type: "Telnet or RS232"
  authentication:
    username: "admin"
    password: 
    timeout: 5
    max_retries: 3

commands:
  device_management:
    description: "Device configuration and control"
    set_device_alias:
      command: "SET ALIAS <DeviceName>"
      description: "Set the device alias (1-31 characters, letters/numbers/'_'/'-'; must start/end with letter or number)."
      response_format: "ALIAS <DeviceName>"
      example_request: "SET ALIAS MeetingRoom"
      example_response: "ALIAS MeetingRoom"
      status: "working"
    get_device_alias:
      command: "GET ALIAS"
      description: "Retrieve the current device alias."
      response_format: "ALIAS <DeviceName>"
      example_request: "GET ALIAS"
      example_response: "ALIAS MeetingRoom"
      status: "working"
    set_ip_address:
      command: "SET IPADDR DHCP | STATIC <IPAddress> <NetMask> [Gateway [DNSServer]]"
      description: "Set device IP configuration to DHCP or static. If DHCP fails, default 169.254.1.100 used."
      response_format: "IPADDR <DHCP | STATIC> <IPAddress> <NetMask> [Gateway [DNSServer]]"
      example_request: "SET IPADDR STATIC 192.168.1.34 255.255.255.0"
      example_response: "IPADDR STATIC 192.168.1.34 255.255.255.0"
      status: "working"
    get_ip_address:
      command: "GET IPADDR"
      description: "Query current IP configuration."
      response_format: "IPADDR <DHCP | STATIC> <IPAddress> <NetMask> [Gateway [DNSServer]]"
      example_request: "GET IPADDR"
      example_response: "IPADDR STATIC 192.168.1.34 255.255.255.0"
      status: "working"
    get_firmware_version:
      command: "GET VER [ALL | ModuleName]"
      description: "Obtain firmware version for specified module or ALL. Modules: MAINSOC, CAMCHIP, VIDEOCHIP."
      response_format: "VER <ModuleName> <Version>"
      example_request: "GET VER MAINSOC"
      example_response: "VER MAINSOC 1.1.7"
      status: "working"
    get_mac_address:
      command: "GET MACADDR"
      description: "Obtain MAC address in colon-separated format."
      response_format: "MACADDR <MacAddress>"
      example_request: "GET MACADDR"
      example_response: "MACADDR AA:BB:CC:DD:EE:07"
      status: "working"
    reboot:
      command: "REBOOT"
      description: "Reboot the device."
      response_format: "REBOOT"
      example_request: "REBOOT"
      example_response: "REBOOT"
      status: "working"
    factory_reset:
      command: "RESET"
      description: "Restore device to factory defaults and reboot to recovery/safe mode."
      response_format: "RESET"
      example_request: "RESET"
      example_response: "RESET"
      status: "working"

  input_output_settings:
    description: "Video and signal input/output configuration"
    set_output_resolution:
      command: "SET VIDOUT_RES <OUT1 | OUT2> <AUTO | Resolution>"
      description: "Set output resolution for specified output or AUTO to follow display EDID. OUT1 supports additional 4K timings."
      response_format: "VIDOUT_RES <OUTx> <AUTO | Resolution>"
      example_request: "SET VIDOUT_RES OUT1 3840x2160P@60"
      example_response: "VIDOUT_RES OUT1 3840x2160P@60"
      status: "working"
    get_output_resolution:
      command: "GET VIDOUT_RES <OUT1 | OUT2 | USB | ALL>"
      description: "Get output resolution(s). Response can show DISCONNECTED and optional AUTO flag."
      response_format: "VIDOUT_RES <OUTx | USB> <Resolution | DISCONNECTED> [AUTO]"
      example_request: "GET VIDOUT_RES ALL"
      example_response: |
        VIDOUT_RES OUT1 3840x2160@60 AUTO
        VIDOUT_RES OUT2 DISCONNECTED AUTO
        VIDOUT_RES USB DISCONNECTED
      status: "working"
    get_output_connection_status:
      command: "GET VIDOUT_CONNECT <OUT1 | OUT2 | USB | ALL>"
      description: "Query whether outputs are connected."
      response_format: "VIDOUT_CONNECT <OUTx | USB> <CONNECTED | DISCONNECTED>"
      example_request: "GET VIDOUT_CONNECT USB"
      example_response: "VIDOUT_CONNECT USB CONNECTED"
      status: "working"
    set_hd_mode:
      command: "SET UVC_HDMODE <ON | OFF>"
      description: "Enable/disable HD mode for UVC USB output (affects supported UVC resolutions list)."
      response_format: "UVC_HDMODE <ON | OFF>"
      example_request: "SET UVC_HDMODE OFF"
      example_response: "UVC_HDMODE OFF"
      status: "working"
    get_hd_mode:
      command: "GET UVC_HDMODE"
      description: "Get current UVC HD mode."
      response_format: "UVC_HDMODE <ON | OFF>"
      example_request: "GET UVC_HDMODE"
      example_response: "UVC_HDMODE OFF"
      status: "working"
    set_output_hdcp:
      command: "SET HDCP <OUT1 | OUT2> <ON | OFF>"
      description: "Enable/disable HDCP protection on HDMI output."
      response_format: "HDCP <OUTx> <ON | OFF>"
      example_request: "SET HDCP OUT1 OFF"
      example_response: "HDCP OUT1 OFF"
      status: "working"
    get_output_hdcp:
      command: "GET HDCP <OUT1 | OUT2 | ALL>"
      description: "Get HDCP configuration for outputs."
      response_format: "HDCP <OUTx> <ON | OFF>"
      example_request: "GET HDCP OUT1"
      example_response: "HDCP OUT1 OFF"
      status: "working"
    get_input_connection_status:
      command: "GET VIDIN_CONNECT <Src | ALL>"
      description: "Query whether specified input (IN1..IN4 or NDI1..NDI4) is connected."
      response_format: "VIDIN_CONNECT <Src> <CONNECTED | DISCONNECTED>"
      example_request: "GET VIDIN_CONNECT IN2"
      example_response: "VIDIN_CONNECT IN2 DISCONNECTED"
      status: "working"
    get_input_signal_status:
      command: "GET VIDIN_SIG <Src | ALL>"
      description: "Query if specified source has valid signal."
      response_format: "VIDIN_SIG <Src> <NO | VALID>"
      example_request: "GET VIDIN_SIG IN3"
      example_response: "VIDIN_SIG IN3 VALID"
      status: "working"
    get_input_video_format:
      command: "GET VIDIN_FORMAT <Src | ALL>"
      description: "Get video format for the source. Format: <WidthxHeight[p],FrameRate;HDRInfo;ColorSpace;ColorDepth>"
      response_format: "VIDIN_FORMAT <Src> <INVALID | VideoFormat>"
      example_request: "GET VIDIN_FORMAT IN3"
      example_response: "VIDIN_FORMAT IN3 3840X2160P,30;NONE HDR;YCBCR444;8BIT"
      status: "working"
    get_input_audio_format:
      command: "GET AUDIN_FORMAT <Src | ALL>"
      description: "Get audio format for the source. Format: <Encoding;SamplingRate;SampingWidth>"
      response_format: "AUDIN_FORMAT <Src> <INVALID | AudioFormat>"
      example_request: "GET AUDIN_FORMAT IN3"
      example_response: "AUDIN_FORMAT IN3 PCM;48KHz;8BIT"
      status: "working"

  video_switching:
    description: "Video source routing and multiview configuration"
    set_low_latency_mode:
      command: "SET LOW_LATENCY_FN <ON | OFF>"
      description: "Enable/disable low latency mode (forces 1920x1080 processing where possible to reduce latency). Default ON."
      response_format: "LOW_LATENCY_FN <ON | OFF>"
      example_request: "SET LOW_LATENCY_FN OFF"
      example_response: "LOW_LATENCY_FN OFF"
      status: "working"
    get_low_latency_mode:
      command: "GET LOW_LATENCY_FN"
      description: "Get low latency mode configuration."
      response_format: "LOW_LATENCY_FN <ON | OFF>"
      example_request: "GET LOW_LATENCY_FN"
      example_response: "LOW_LATENCY_FN OFF"
      status: "working"
    set_input_to_output:
      command: "SET SW <Src | NONE> [OUT1 | OUT2]"
      description: "Switch an input to an output. If OUT not specified, applies to all outputs. NONE shows guide screen."
      response_format: "SW <Src | NONE> [OUTx]"
      example_request: "SET SW IN3 OUT1"
      example_response: "SW IN3 OUT1"
      status: "working"
    get_input_of_output:
      command: "GET SW <OUT1 | OUT2 | ALL>"
      description: "Get which source is displayed on an output. MV indicates multiview state for OUT2."
      response_format: "SW <Src | NONE | MV> <OUTx>"
      example_request: "GET SW OUT1"
      example_response: "SW IN3 OUT1"
      status: "working"
    set_multiview_layout:
      command: "SET MV_LAYOUT <LayoutID | LayoutName>"
      description: "Set multiview layout used on OUT2. Supported layouts: 0x100 FullScreen, 0x101 PiP, 0x102 SbS, 0x103 LBRS, 0x104 Pyramid, 0x105 Quad."
      response_format: "MV_LAYOUT <LayoutID | LayoutName>"
      example_request: "SET MV_LAYOUT QUAD"
      example_response: "MV_LAYOUT QUAD"
      status: "working"
    get_multiview_layout:
      command: "GET MV_LAYOUT"
      description: "Get the current multiview layout (ID and name)."
      response_format: "MV_LAYOUT <LayoutID> <LayoutName>"
      example_request: "GET MV_LAYOUT"
      example_response: "MV_LAYOUT 0X101 PIP"
      status: "working"
    set_multiview_layout_and_sources:
      command: "SET MV_WIN_SRC <LayoutID | LayoutName | Current> WinNo1 <Src1 | NONE> [WinNo2 <Src2 | NONE> ...]"
      description: "Set layout and assign video sources to child windows. Use 'Current' to keep current layout."
      response_format: "MV_WIN_SRC <LayoutID | LayoutName> WinNo1 <Src1 | NONE> ..."
      example_request: "SET MV_WIN_SRC QUAD 1 IN2"
      example_response: "MV_WIN_SRC QUAD 1 IN2"
      status: "working"
    get_multiview_layout_and_sources:
      command: "GET MV_WIN_SRC"
      description: "Get current multiview layout and child window sources."
      response_format: "MV_WIN_SRC <LayoutName> WinNo1 <Src1 | NONE> ..."
      example_request: "GET MV_WIN_SRC"
      example_response: "MV_WIN_SRC SbS WIN1 IN2 WIN2 NONE"
      status: "working"

  audio_processing:
    description: "DSP audio matrix, mixing, mute and volume controls"
    set_dsp_audio_mixing:
      command: "SET DSP_MIX <DspOut> <DspIn> <ON | OFF>"
      description: "Set whether given audio input participates in mixing for the specified audio output. Prohibited: USBIN->USBIN, USBHOST->USBHOST, ANALOGIN->ANALOGOUT."
      response_format: "DSP_MIX <DspOut> <DspIn> <ON | OFF>"
      example_request: "SET DSP_MIX HDMIOUT HDMIIN ON"
      example_response: "DSP_MIX HDMIOUT HDMIIN ON"
      status: "working"
    get_dsp_audio_mixing:
      command: "GET DSP_MIX <DspOut> <DspIn> | GET DSP_MIX <DspOut | ALL>"
      description: "Get mixing config for a given crosspoint or list inputs participating for an output."
      response_format: "DSP_MIX ... (see manual)"
      example_request: "GET DSP_MIX ALL"
      example_response: |
        DSP_MIX USBIN USBHOST
        DSP_MIX HDMIOUT HDMIIN
        DSP_MIX USBHOST
        DSP_MIX ANALOGOUT HDMIIN
      status: "working"
    set_dsp_input_channel:
      command: "SET DSP_AUD_SRC <USBIN <IN1 | IN2> | HDMIIN <IN3 | IN4>>"
      description: "Select which physical input is routed into the DSP's USBIN or HDMIIN channel (one of two)."
      response_format: "DSP_AUD_SRC ..."
      example_request: "SET DSP_AUD_SRC USBIN IN1"
      example_response: "DSP_AUD_SRC USBIN IN1"
      status: "working"
    get_dsp_input_channel:
      command: "GET DSP_AUD_SRC <USBIN | HDMIIN | ALL>"
      description: "Get DSP input channel mapping."
      response_format: "DSP_AUD_SRC USBIN <IN1 | IN2> | DSP_AUD_SRC HDMIIN <IN3 | IN4>"
      example_request: "GET DSP_AUD_SRC USBIN"
      example_response: "DSP_AUD_SRC USBIN IN1"
      status: "working"
    set_dsp_input_mute:
      command: "SET DSP_AUD_GAIN_MUTE <DspIn> <ON | OFF>"
      description: "Mute/unmute specified DSP input channel."
      response_format: "DSP_AUD_GAIN_MUTE <DspIn> <ON | OFF>"
      example_request: "SET DSP_AUD_GAIN_MUTE USBIN ON"
      example_response: "DSP_AUD_GAIN_MUTE USBIN ON"
      status: "working"
    get_dsp_input_mute:
      command: "GET DSP_AUD_GAIN_MUTE <DspIn | ALL>"
      description: "Get mute state for DSP input channels."
      response_format: "DSP_AUD_GAIN_MUTE <DspIn> <ON | OFF>"
      example_request: "GET DSP_AUD_GAIN_MUTE USBIN"
      example_response: "DSP_AUD_GAIN_MUTE USBIN ON"
      status: "working"
    set_dsp_input_gain:
      command: "SET DSP_AUD_GAIN <DspIn> <Gain>"
      description: "Set DSP input gain in dB range [-20, +30]. Setting gain disables mute for that channel."
      response_format: "DSP_AUD_GAIN <DspIn> <Gain>"
      example_request: "SET DSP_AUD_GAIN USBIN 3"
      example_response: "DSP_AUD_GAIN USBIN 3"
      status: "working"
    get_dsp_input_gain:
      command: "GET DSP_AUD_GAIN <DspIn | ALL>"
      description: "Query DSP input gain(s)."
      response_format: "DSP_AUD_GAIN <DspIn> <Gain>"
      example_request: "GET DSP_AUD_GAIN USBIN"
      example_response: "DSP_AUD_GAIN USBIN 3"
      status: "working"
    set_dsp_output_mute:
      command: "SET DSP_AUD_VOL_MUTE <DspOut> <ON | OFF>"
      description: "Mute/unmute specified DSP output channel."
      response_format: "DSP_AUD_VOL_MUTE <DspOut> <ON | OFF>"
      example_request: "SET DSP_AUD_VOL_MUTE USBHOST ON"
      example_response: "DSP_AUD_VOL_MUTE USBHOST ON"
      status: "working"
    get_dsp_output_mute:
      command: "GET DSP_AUD_VOL_MUTE <DspOut | ALL>"
      description: "Get mute state for DSP outputs."
      response_format: "DSP_AUD_VOL_MUTE <DspOut> <ON | OFF>"
      example_request: "GET DSP_AUD_VOL_MUTE USBHOST"
      example_response: "DSP_AUD_VOL_MUTE USBHOST ON"
      status: "working"
    set_dsp_output_volume:
      command: "SET DSP_AUD_VOL <DspOut> <Volume>"
      description: "Set DSP output volume in dB range [-100, 0]. Setting volume disables mute for that output."
      response_format: "DSP_AUD_VOL <DspOut> <Volume>"
      example_request: "SET DSP_AUD_VOL HDMIOUT -6"
      example_response: "DSP_AUD_VOL HDMIOUT -6"
      status: "working"
    get_dsp_output_volume:
      command: "GET DSP_AUD_VOL <DspOut | ALL>"
      description: "Query DSP output volumes."
      response_format: "DSP_AUD_VOL <DspOut> <Volume>"
      example_request: "GET DSP_AUD_VOL HDMIOUT"
      example_response: "DSP_AUD_VOL HDMIOUT -6"
      status: "working"

  standby_peripheral_control:
    description: "Standby, CEC, RS232 and peripheral related controls"
    set_standby_mode:
      command: "SET STANDBY <ON | OFF>"
      description: "Manually set device to enter (OFF) or exit (ON) standby mode."
      response_format: "STANDBY <ON | OFF>"
      example_request: "SET STANDBY OFF"
      example_response: "STANDBY OFF"
      status: "working"
    get_standby_mode:
      command: "GET STANDBY"
      description: "Query whether the device is in standby."
      response_format: "STANDBY <ON | OFF>"
      example_request: "GET STANDBY"
      example_response: "STANDBY OFF"
      status: "working"
    set_automatic_standby:
      command: "SET AUTO_STANDBY_FN <ON | OFF>"
      description: "Enable/disable automatic standby feature."
      response_format: "AUTO_STANDBY_FN <ON | OFF>"
      example_request: "SET AUTO_STANDBY_FN OFF"
      example_response: "AUTO_STANDBY_FN OFF"
      status: "working"
    get_automatic_standby:
      command: "GET AUTO_STANDBY_FN"
      description: "Query automatic standby feature state."
      response_format: "AUTO_STANDBY_FN <ON | OFF>"
      example_request: "GET AUTO_STANDBY_FN"
      example_response: "AUTO_STANDBY_FN OFF"
      status: "working"
    set_automatic_standby_timeout:
      command: "SET AUTO_STANDBY_D <TimeOut>"
      description: "Set automatic standby timeout in seconds (0-3600). 0 means immediate standby when idle."
      response_format: "AUTO_STANDBY_D <TimeOut>"
      example_request: "SET AUTO_STANDBY_D 360"
      example_response: "AUTO_STANDBY_D 360"
      status: "working"
    get_automatic_standby_timeout:
      command: "GET AUTO_STANDBY_D"
      description: "Query automatic standby timeout value."
      response_format: "AUTO_STANDBY_D <TimeOut>"
      example_request: "GET AUTO_STANDBY_D"
      example_response: "AUTO_STANDBY_D 360"
      status: "working"
    set_cec_command:
      command: "SET CECCMD_EDIT <OUT1 | OUT2> <ON | OFF> <CECCode>"
      description: "Configure stored CEC command for powering displays on/off. CECCode is hex string without spaces."
      response_format: "CECCMD_EDIT <OUTx> <ON | OFF> <CECCode>"
      example_request: "SET CECCMD_EDIT OUT1 ON 4004"
      example_response: "CECCMD_EDIT OUT1 ON 4004"
      status: "working"
    get_cec_command:
      command: "GET CECCMD_EDIT <<OUT1 | OUT2> <ON | OFF> | ALL>"
      description: "Query CEC command configuration(s)."
      response_format: "CECCMD_EDIT <OUTx> <ON | OFF> <CECCode>"
      example_request: "GET CECCMD_EDIT OUT1 ON"
      example_response: "CECCMD_EDIT OUT1 ON 4004"
      status: "working"
    set_rs232_work_mode:
      command: "SET UART_MODE <API | COM>"
      description: "Set RS232 port work mode. API = receive API commands; COM = conventional peripheral control."
      response_format: "UART_MODE <API | COM>"
      example_request: "SET UART_MODE API"
      example_response: "UART_MODE API"
      status: "working"
    get_rs232_work_mode:
      command: "GET UART_MODE"
      description: "Get RS232 port work mode."
      response_format: "UART_MODE <API | COM>"
      example_request: "GET UART_MODE"
      example_response: "UART_MODE API"
      status: "working"
    set_power_on_off_via_rs232:
      command: "SET UARTPWR_FN <ON | OFF>"
      description: "Configure whether power on/off will send RS232 command in addition to CEC. Requires UART_MODE=COM and commands defined."
      response_format: "UARTPWR_FN <ON | OFF>"
      example_request: "SET UARTPWR_FN ON"
      example_response: "UARTPWR_FN ON"
      status: "working"
    get_power_on_off_via_rs232:
      command: "GET UARTPWR_FN"
      description: "Query RS232 power on/off sending configuration."
      response_format: "UARTPWR_FN <ON | OFF>"
      example_request: "GET UARTPWR_FN"
      example_response: "UARTPWR_FN ON"
      status: "working"
    configure_rs232_settings:
      command: "SET UART_CFG <BaudRate> <Parity> <DataBit> <StopBit>"
      description: "Configure RS232 port parameters. BaudRate: 9600,19200,38400,57600,115200. Parity: NONE, ODD, EVEN. DataBit: 7,8. StopBit: 1,2."
      response_format: "UART_CFG <BaudRate> <Parity> <DataBit> <StopBit>"
      example_request: "SET UART_CFG 9600 NONE 8 1"
      example_response: "UART_CFG 9600 NONE 8 1"
      status: "working"
    get_rs232_settings:
      command: "GET UART_CFG"
      description: "Query RS232 configuration."
      response_format: "UART_CFG <BaudRate> <Parity> <DataBit> <StopBit>"
      example_request: "GET UART_CFG"
      example_response: "UART_CFG 9600 NONE 8 1"
      status: "working"
    set_rs232_baud_rate:
      command: "SET UART_B <BaudRate>"
      description: "Set RS232 baud rate separately."
      response_format: "UART_B <BaudRate>"
      example_request: "SET UART_B 9600"
      example_response: "UART_B 9600"
      status: "working"
    get_rs232_baud_rate:
      command: "GET UART_B"
      description: "Get current RS232 baud rate."
      response_format: "UART_B <BaudRate>"
      example_request: "GET UART_B"
      example_response: "UART_B 9600"
      status: "working"
    set_rs232_command:
      command: "SET UART_CMD <CmdName> <HEX | STR> <CmdStr>"
      description: "Configure RS232 command string. HEX: no spaces hex bytes; STR: printable string (spaces allowed)."
      response_format: "UART_CMD <CmdName> <HEX | STR> <CmdStr>"
      example_request: "SET UART_CMD ON STR PowerOn"
      example_response: "UART_CMD ON STR PowerOn"
      status: "working"
    delete_rs232_command:
      command: "SET UART_CMD_D <CmdName>"
      description: "Delete a defined RS232 command."
      response_format: "UART_CMD_D <CmdName>"
      example_request: "SET UART_CMD_D ON"
      example_response: "UART_CMD_D ON"
      status: "working"
    get_rs232_command:
      command: "GET UART_CMD <CmdName | ALL>"
      description: "Query a defined RS232 command or all commands."
      response_format: "UART_CMD <CmdName> <HEX | STR> <CmdStr>"
      example_request: "GET UART_CMD ON"
      example_response: "UART_CMD ON STR PowerOn"
      status: "working"
    send_rs232_command:
      command: "SET UART_CMD_S <CmdName>"
      description: "Send a previously defined RS232 command."
      response_format: "UART_CMD_S <CmdName>"
      example_request: "SET UART_CMD_S ON"
      example_response: "UART_CMD_S ON"
      status: "working"
    send_rs232_data:
      command: "SET UART_S <HEX | STR> <CmdStr>"
      description: "Send RS232 data directly (HEX: hex bytes no spaces; STR: printable string)."
      response_format: "UART_S <HEX | STR> <CmdStr>"
      example_request: "SET UART_S STR PowerOn"
      example_response: "UART_S STR PowerOn"
      status: "working"
    set_send_cmd:
      command: "SET SEND_CMD <ON | OFF | CmdName> [RS232 | CEC | ALL]"
      description: "Configure device to send CEC and/or RS232 command when powering. If method omitted, uses UARTPWR_FN config."
      response_format: "SEND_CMD <ON | OFF | CmdName> [RS232 | CEC | ALL]"
      example_request: "SET SEND_CMD ON CEC"
      example_response: "SEND_CMD ON CEC"
      status: "working"
    send_cec_data:
      command: "SET CEC_CMD <OUT1 | OUT2> <CECCode>"
      description: "Send arbitrary CEC data directly."
      response_format: "CEC_CMD <OUTx> <CECCode>"
      example_request: "SET CEC_CMD OUT1 4004"
      example_response: "CEC_CMD OUT1 4004"
      status: "working"

  ndi_input_output:
    description: "NDI RX/TX configuration and control"
    set_ndi_rx_group_name:
      command: "SET NDI_RX_GROUP <GroupName>"
      description: "Set the NDI RX module group name (default 'Public')."
      response_format: "NDI_RX_GROUP <GroupName>"
      example_request: "SET NDI_RX_GROUP MeetingRoom1"
      example_response: "NDI_RX_GROUP MeetingRoom1"
      status: "working"
    get_ndi_rx_group_name:
      command: "GET NDI_RX_GROUP"
      description: "Get the NDI RX group name."
      response_format: "NDI_RX_GROUP <GroupName>"
      example_request: "GET NDI_RX_GROUP"
      example_response: "NDI_RX_GROUP MeetingRoom1"
      status: "working"
    set_ndi_rx_device_name:
      command: "SET NDI_RX_DEV_NAME <DeviceName>"
      description: "Set the device name for the NDI RX module."
      response_format: "NDI_RX_DEV_NAME <DeviceName>"
      example_request: "SET NDI_RX_DEV_NAME CamMixer"
      example_response: "NDI_RX_DEV_NAME CamMixer"
      status: "working"
    get_ndi_rx_device_name:
      command: "GET NDI_RX_DEV_NAME"
      description: "Get the NDI RX device name."
      response_format: "NDI_RX_DEV_NAME <DeviceName>"
      example_request: "GET NDI_RX_DEV_NAME"
      example_response: "NDI_RX_DEV_NAME CamMixer"
      status: "working"
    get_ndi_device_list:
      command: "GET NDI_SCAN_DEV_LIST <TX | RX | ALL>"
      description: "Obtain list of discovered NDI devices on network."
      response_format: "NDI_SCAN_DEV_LIST <TX | RX> <DeviceName> <IPAddress>"
      example_request: "GET NDI_SCAN_DEV_LIST TX"
      example_response: |
        NDI_SCAN_DEV_LIST TX Team1 169.254.34.71
        NDI_SCAN_DEV_LIST TX Team2 169.254.179.80
