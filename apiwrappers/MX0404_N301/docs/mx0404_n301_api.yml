module: device
description: Telnet API commands for the MX0404-N301 matrix switcher

schema:
  command:
    required:
      - command
      - syntax
      - description
      - response
    properties:
      command: string
      syntax: string
      description: string
      parameters: list
      response:
        type: string
        schema: object

commands:
  switch:
    set:
      command: "SET SW"
      syntax: "SET SW <input> <output|all>"
      description: "Route one input to one output or to all outputs"
      parameters:
        - input
        - output
      response:
        type: confirmation
        schema:
          input: string
          output: string
    get:
      command: "GET MP"
      syntax: "GET MP <output|all>"
      description: "Get the input mapping for one output or all outputs"
      parameters:
        - output
      response:
        type: string
        schema:
          mapping: string

  audio_mute:
    set:
      command: "SET AUDIO_MUTE"
      syntax: "SET AUDIO_MUTE <zone> <on|off>"
      description: "Mute or unmute an analog audio zone"
      parameters:
        - zone
        - state
      response:
        type: confirmation
        schema:
          zone: string
          state: string
    get:
      command: "GET AUDIO_MUTE"
      syntax: "GET AUDIO_MUTE <zone>"
      description: "Get the mute state for an analog audio zone"
      parameters:
        - zone
      response:
        type: string
        schema:
          zone: string
          state: string

  audio_switch_mode:
    set:
      command: "SET AUDIOSW_M"
      syntax: "SET AUDIOSW_M <out1|out2|all> <independent|followvm>"
      description: "Set the audio switching mode for one or all audio-follow outputs"
      parameters:
        - output
        - mode
      response:
        type: confirmation
        schema:
          output: string
          mode: string
    get:
      command: "GET AUDIOSW_M"
      syntax: "GET AUDIOSW_M <out1|out2|all>"
      description: "Get the audio switching mode for one or all audio-follow outputs"
      parameters:
        - output
      response:
        type: string
        schema:
          output: string
          mode: string

  avmute:
    set:
      command: "SET AVMUTE"
      syntax: "SET AVMUTE <output> <on|off>"
      description: "Enable or disable AV mute on an HDMI output"
      parameters:
        - output
        - state
      response:
        type: confirmation
        schema:
          output: string
          state: string
    get:
      command: "GET AVMUTE"
      syntax: "GET AVMUTE <output>"
      description: "Get the AV mute state on an HDMI output"
      parameters:
        - output
      response:
        type: string
        schema:
          output: string
          state: string

  cec_power:
    command: "SET CEC_PWR"
    syntax: "SET CEC_PWR <output|all> <on|off>"
    description: "Send a CEC power command to one or all sinks"
    parameters:
      - output
      - state
    response:
      type: confirmation
      schema:
        output: string
        state: string

  cec_auto:
    set:
      command: "SET AUTOCEC_FN"
      syntax: "SET AUTOCEC_FN <output|all> <on|off>"
      description: "Enable or disable automatic CEC power behavior"
      parameters:
        - output
        - state
      response:
        type: confirmation
        schema:
          output: string
          state: string
    get:
      command: "GET AUTOCEC_FN"
      syntax: "GET AUTOCEC_FN <output|all>"
      description: "Get the automatic CEC power state"
      parameters:
        - output
      response:
        type: string
        schema:
          output: string
          state: string

  cec_delay:
    set:
      command: "SET AUTOCEC_D"
      syntax: "SET AUTOCEC_D <output|all> <minutes>"
      description: "Set the automatic CEC power-off delay"
      parameters:
        - output
        - minutes
      response:
        type: confirmation
        schema:
          output: string
          minutes: integer
    get:
      command: "GET AUTOCEC_D"
      syntax: "GET AUTOCEC_D <output|all>"
      description: "Get the automatic CEC power-off delay"
      parameters:
        - output
      response:
        type: string
        schema:
          output: string
          minutes: integer

  input_hdcp_support:
    set:
      command: "SET HDCP_S"
      syntax: "SET HDCP_S <input|all> <on|off>"
      description: "Enable or disable HDCP support on one or all inputs"
      parameters:
        - input
        - state
      response:
        type: confirmation
        schema:
          input: string
          state: string
    get:
      command: "GET HDCP_S"
      syntax: "GET HDCP_S <input|all>"
      description: "Get the HDCP support state for one or all inputs"
      parameters:
        - input
      response:
        type: string
        schema:
          input: string
          state: string

  output_hdcp_mode:
    set:
      command: "SET HDCP"
      syntax: "SET HDCP <output|all> <follow|auto|hdcp1.x|off>"
      description: "Set the HDCP mode for one or all outputs"
      parameters:
        - output
        - mode
      response:
        type: confirmation
        schema:
          output: string
          mode: string
    get:
      command: "GET HDCP"
      syntax: "GET HDCP <output|all>"
      description: "Get the HDCP mode for one or all outputs"
      parameters:
        - output
      response:
        type: string
        schema:
          output: string
          mode: string

  edid:
    set:
      command: "SET EDID"
      syntax: "SET EDID <input|all> <profile>"
      description: "Assign an EDID preset to one or all inputs"
      parameters:
        - input
        - profile
      response:
        type: confirmation
        schema:
          input: string
          profile: integer
    get:
      command: "GET EDID"
      syntax: "GET EDID <input|all>"
      description: "Get the EDID preset assigned to one input or all inputs"
      parameters:
        - input
      response:
        type: string
        schema:
          edid: string

  edid_write:
    command: "SET EDID_W"
    syntax: "SET EDID_W <input|all> <block0|block1> <hex_data>"
    description: "Write EDID block data to an input"
    parameters:
      - input
      - block
      - hex_data
    response:
      type: confirmation
      schema:
        input: string
        block: string
        status: string

  edid_read:
    command: "GET EDID_R"
    syntax: "GET EDID_R <output>"
    description: "Read EDID block data from an output"
    parameters:
      - output
    response:
      type: string
      schema:
        output: string
        block: string
        data: string

  preset:
    save:
      command: "SAVE PRESET"
      syntax: "SAVE PRESET <slot>"
      description: "Save the current routing state to a preset slot"
      parameters:
        - slot
      response:
        type: confirmation
        schema:
          slot: integer
    restore:
      command: "RESTORE PRESET"
      syntax: "RESTORE PRESET <slot>"
      description: "Recall a stored preset slot"
      parameters:
        - slot
      response:
        type: confirmation
        schema:
          slot: integer

  ir_system_code:
    set:
      command: "SET IR_SC"
      syntax: "SET IR_SC <all|mode1|mode2>"
      description: "Set the IR system code"
      parameters:
        - mode
      response:
        type: confirmation
        schema:
          mode: string
    get:
      command: "GET IR_SC"
      syntax: "GET IR_SC"
      description: "Get the current IR system code"
      parameters: []
      response:
        type: string
        schema:
          mode: string

  ip_address:
    set:
      command: "SET IPADDR"
      syntax: "SET IPADDR <ip> MASK <mask> GATEWAY <gateway>"
      description: "Set the static IP address values"
      parameters:
        - ip
        - mask
        - gateway
      response:
        type: confirmation
        schema:
          ip: string
          mask: string
          gateway: string
    get:
      command: "GET IPADDR"
      syntax: "GET IPADDR"
      description: "Get the current IP address, mask, and gateway"
      parameters: []
      response:
        type: string
        schema:
          ip: string
          mask: string
          gateway: string

  network_mode:
    set:
      command: "SET NETCFG MODE"
      syntax: "SET NETCFG MODE <DHCP|STATIC>"
      description: "Set the network configuration mode"
      parameters:
        - mode
      response:
        type: confirmation
        schema:
          mode: string
    get:
      command: "GET NETCFG MODE"
      syntax: "GET NETCFG MODE"
      description: "Get the network configuration mode"
      parameters: []
      response:
        type: string
        schema:
          mode: string

  standby:
    set:
      command: "STANDBY / WAKE"
      syntax: "STANDBY | WAKE"
      description: "Put the unit into standby or wake it"
      parameters: []
      response:
        type: confirmation
        schema:
          state: string
    get:
      command: "GET STANDBY"
      syntax: "GET STANDBY"
      description: "Get the current standby state"
      parameters: []
      response:
        type: string
        schema:
          state: string

  input_status:
    connection:
      command: "GET VIDIN_CONNECT"
      syntax: "GET VIDIN_CONNECT <input>"
      description: "Get whether an input is physically connected"
      parameters:
        - input
      response:
        type: string
        schema:
          input: string
          state: string
    signal:
      command: "GET VIDIN_SIG"
      syntax: "GET VIDIN_SIG <input>"
      description: "Get whether an input has a valid signal"
      parameters:
        - input
      response:
        type: string
        schema:
          input: string
          state: string
    format:
      command: "GET VIDIN_FORMAT"
      syntax: "GET VIDIN_FORMAT <input>"
      description: "Get the video format details for an input"
      parameters:
        - input
      response:
        type: string
        schema:
          input: string
          format: string
    hdcp:
      command: "GET VIDIN_HDCP"
      syntax: "GET VIDIN_HDCP <input>"
      description: "Get the negotiated HDCP version on an input"
      parameters:
        - input
      response:
        type: string
        schema:
          input: string
          hdcp: string
    stretch:
      set:
        command: "SET VIDIN_STRETCH"
        syntax: "SET VIDIN_STRETCH <input> <origin|full>"
        description: "Set the legacy input stretch mode"
        parameters:
          - input
          - mode
        response:
          type: confirmation
          schema:
            input: string
            mode: string
      get:
        command: "GET VIDIN_STRETCH"
        syntax: "GET VIDIN_STRETCH <input>"
        description: "Get the legacy input stretch mode"
        parameters:
          - input
        response:
          type: string
          schema:
            input: string
            mode: string

  output_status:
    connection:
      command: "GET VIDOUT_CONNECT"
      syntax: "GET VIDOUT_CONNECT <output>"
      description: "Get whether an output is physically connected"
      parameters:
        - output
      response:
        type: string
        schema:
          output: string
          state: string
    signal:
      command: "GET VIDOUT_SIG"
      syntax: "GET VIDOUT_SIG <output>"
      description: "Get whether an output has a valid signal"
      parameters:
        - output
      response:
        type: string
        schema:
          output: string
          state: string
    video_format:
      command: "GET VIDOUT_FORMAT"
      syntax: "GET VIDOUT_FORMAT <output>"
      description: "Get the video format details for an output"
      parameters:
        - output
      response:
        type: string
        schema:
          output: string
          format: string
    audio_format:
      command: "GET AUDOUT_FORMAT"
      syntax: "GET AUDOUT_FORMAT <output>"
      description: "Get the audio format details for an output"
      parameters:
        - output
      response:
        type: string
        schema:
          output: string
          format: string
    hdcp:
      command: "GET VIDOUT_HDCP"
      syntax: "GET VIDOUT_HDCP <output>"
      description: "Get the negotiated HDCP version on an output"
      parameters:
        - output
      response:
        type: string
        schema:
          output: string
          hdcp: string
    scaling:
      set:
        command: "SET VIDOUT_SCALE"
        syntax: "SET VIDOUT_SCALE <output|all> <auto|manual|bypass>"
        description: "Set the output scaler mode"
        parameters:
          - output
          - mode
        response:
          type: confirmation
          schema:
            output: string
            mode: string
      get:
        command: "GET VIDOUT_SCALE"
        syntax: "GET VIDOUT_SCALE <output|all>"
        description: "Get the output scaler mode"
        parameters:
          - output
        response:
          type: string
          schema:
            output: string
            mode: string
    resolution:
      set:
        command: "SET VIDOUT_RES"
        syntax: "SET VIDOUT_RES <output|all> <resolution>"
        description: "Set the output resolution when scaling is manual"
        parameters:
          - output
          - resolution
        response:
          type: confirmation
          schema:
            output: string
            resolution: string
      get:
        command: "GET VIDOUT_RES"
        syntax: "GET VIDOUT_RES <output|all>"
        description: "Get the configured output resolution"
        parameters:
          - output
        response:
          type: string
          schema:
            output: string
            resolution: string
    forced_sdr:
      set:
        command: "SET FORCED_SDR"
        syntax: "SET FORCED_SDR <output> <on|off>"
        description: "Enable or disable forced SDR on an output"
        parameters:
          - output
          - state
        response:
          type: confirmation
          schema:
            output: string
            state: string
      get:
        command: "GET FORCED_SDR"
        syntax: "GET FORCED_SDR <output>"
        description: "Get the forced SDR state of an output"
        parameters:
          - output
        response:
          type: string
          schema:
            output: string
            state: string
    active:
      set:
        command: "SET VIDOUT_ACTIVE"
        syntax: "SET VIDOUT_ACTIVE <mv1|vw1|vw2|vw3> <ON|OFF>"
        description: "Enable or disable a multiview or videowall profile"
        parameters:
          - output_id
          - state
        response:
          type: confirmation
          schema:
            output_id: string
            state: string
      get:
        command: "GET VIDOUT_ACTIVE"
        syntax: "GET VIDOUT_ACTIVE <mv1|vw1|vw2|vw3>"
        description: "Get whether a multiview or videowall profile is active"
        parameters:
          - output_id
        response:
          type: string
          schema:
            output_id: string
            state: string
    mode:
      set:
        command: "SET VIDOUT_MODE"
        syntax: "SET VIDOUT_MODE <output_id> <scene>"
        description: "Set the active multiview or videowall scene"
        parameters:
          - output_id
          - scene
        response:
          type: confirmation
          schema:
            output_id: string
            scene: string
      get:
        command: "GET VIDOUT_MODE"
        syntax: "GET VIDOUT_MODE [output_id]"
        description: "Get the scene summary or the scene for one multiview or videowall profile"
        parameters:
          - output_id
        response:
          type: string
          schema:
            output_id: string
            scene: string

  videowall_window_source:
    set:
      command: "SET VW_WIN_SRC"
      syntax: "SET VW_WIN_SRC <vw> <layout> <winref1> <src1> [<winref2> <src2> ...]"
      description: "Assign sources to windows in a videowall layout"
      parameters:
        - videowall
        - layout
        - window_source_pairs
      response:
        type: confirmation
        schema:
          videowall: string
          layout: string
          mapping: string
    get:
      command: "GET VW_WIN_SRC"
      syntax: "GET VW_WIN_SRC <vw> <layout> [window_refs...]"
      description: "Get source assignments for a videowall layout"
      parameters:
        - videowall
        - layout
        - window_refs
      response:
        type: string
        schema:
          videowall: string
          layout: string
          mapping: string

  multiview_window_source:
    set:
      command: "SET MV_WIN_SRC"
      syntax: "SET MV_WIN_SRC <mv> <scene> <win1> <src1> [<win2> <src2> ...]"
      description: "Assign sources to windows in a multiview scene"
      parameters:
        - multiview
        - scene
        - window_source_pairs
      response:
        type: confirmation
        schema:
          multiview: string
          scene: string
          mapping: string
    get:
      command: "GET MV_WIN_SRC"
      syntax: "GET MV_WIN_SRC <mv> <scene>"
      description: "Get source assignments for a multiview scene"
      parameters:
        - multiview
        - scene
      response:
        type: string
        schema:
          multiview: string
          scene: string
          mapping: string

  multiview_audio_switch:
    set:
      command: "SET MV_AUDIO_SW"
      syntax: "SET MV_AUDIO_SW <mv> <scene> <WINDOW|INDEPENDENT> <source>"
      description: "Set multiview audio routing"
      parameters:
        - multiview
        - scene
        - audio_mode
        - source
      response:
        type: confirmation
        schema:
          multiview: string
          scene: string
          audio_mode: string
          source: string
    get:
      command: "GET MV_AUDIO_SW"
      syntax: "GET MV_AUDIO_SW <mv> <scene>"
      description: "Get multiview audio routing"
      parameters:
        - multiview
        - scene
      response:
        type: string
        schema:
          multiview: string
          scene: string
          audio_mode: string
          source: string

  multiview_window_border:
    set:
      command: "SET MV_WIN_BORDER_FN"
      syntax: "SET MV_WIN_BORDER_FN <output_id> <scene> <win1> <ON|OFF> [<win2> <ON|OFF> ...]"
      description: "Enable or disable borders on one or more windows"
      parameters:
        - output_id
        - scene
        - window_state_pairs
      response:
        type: confirmation
        schema:
          output_id: string
          scene: string
          borders: string
    get:
      command: "GET MV_WIN_BORDER_FN"
      syntax: "GET MV_WIN_BORDER_FN <output_id> <scene>"
      description: "Get border enable states for a scene"
      parameters:
        - output_id
        - scene
      response:
        type: string
        schema:
          output_id: string
          scene: string
          borders: string

  multiview_window_border_attr:
    set:
      command: "SET MV_WIN_BORDER_ATTR"
      syntax: "SET MV_WIN_BORDER_ATTR <output_id> <scene> <win1> <color;width> [<win2> <color;width> ...]"
      description: "Set border color and width for one or more windows"
      parameters:
        - output_id
        - scene
        - window_attr_pairs
      response:
        type: confirmation
        schema:
          output_id: string
          scene: string
          borders: string
    get:
      command: "GET MV_WIN_BORDER_ATTR"
      syntax: "GET MV_WIN_BORDER_ATTR <output_id> <scene> [window_ref]"
      description: "Get border color and width for a scene or one window"
      parameters:
        - output_id
        - scene
        - window_ref
      response:
        type: string
        schema:
          output_id: string
          scene: string
          borders: string

  legacy_multiview:
    layout:
      set:
        command: "SET VIDOUT_MODE"
        syntax: "SET VIDOUT_MODE <0|1|2|4|5>"
        description: "Set the legacy global multiview layout mode"
        parameters:
          - mode
        response:
          type: confirmation
          schema:
            mode: integer
      get:
        command: "GET VIDOUT_MODE"
        syntax: "GET VIDOUT_MODE"
        description: "Get the legacy global multiview layout mode"
        parameters: []
        response:
          type: string
          schema:
            mode: string
    dual_source:
      set:
        command: "SET VIDOUT_DUAL_SRC"
        syntax: "SET VIDOUT_DUAL_SRC <left_input> <right_input>"
        description: "Set the legacy dual-view source assignment"
        parameters:
          - left_input
          - right_input
        response:
          type: confirmation
          schema:
            sources: string
      get:
        command: "GET VIDOUT_DUAL_SRC"
        syntax: "GET VIDOUT_DUAL_SRC"
        description: "Get the legacy dual-view source assignment"
        parameters: []
        response:
          type: string
          schema:
            sources: string
    pip_source:
      set:
        command: "SET VIDOUT_PIP_SRC"
        syntax: "SET VIDOUT_PIP_SRC <main_input> <pip_input>"
        description: "Set the legacy PIP source assignment"
        parameters:
          - main_input
          - pip_input
        response:
          type: confirmation
          schema:
            sources: string
      get:
        command: "GET VIDOUT_PIP_SRC"
        syntax: "GET VIDOUT_PIP_SRC"
        description: "Get the legacy PIP source assignment"
        parameters: []
        response:
          type: string
          schema:
            sources: string
    quad_source:
      set:
        command: "SET VIDOUT_QUAD_SRC"
        syntax: "SET VIDOUT_QUAD_SRC <tl> <tr> <bl> <br>"
        description: "Set the legacy quad-view source assignment"
        parameters:
          - top_left
          - top_right
          - bottom_left
          - bottom_right
        response:
          type: confirmation
          schema:
            sources: string
      get:
        command: "GET VIDOUT_QUAD_SRC"
        syntax: "GET VIDOUT_QUAD_SRC"
        description: "Get the legacy quad-view source assignment"
        parameters: []
        response:
          type: string
          schema:
            sources: string
    master_source:
      set:
        command: "SET VIDOUT_MASTER_SRC"
        syntax: "SET VIDOUT_MASTER_SRC <left> <top_right> <middle_right> <bottom_right>"
        description: "Set the legacy master-view source assignment"
        parameters:
          - left
          - top_right
          - middle_right
          - bottom_right
        response:
          type: confirmation
          schema:
            sources: string
      get:
        command: "GET VIDOUT_MASTER_SRC"
        syntax: "GET VIDOUT_MASTER_SRC"
        description: "Get the legacy master-view source assignment"
        parameters: []
        response:
          type: string
          schema:
            sources: string
    pip_size:
      set:
        command: "SET VIDOUT_PIP_SIZE"
        syntax: "SET VIDOUT_PIP_SIZE <0|1|2>"
        description: "Set the legacy PIP window size"
        parameters:
          - size
        response:
          type: confirmation
          schema:
            size: integer
      get:
        command: "GET VIDOUT_PIP_SIZE"
        syntax: "GET VIDOUT_PIP_SIZE"
        description: "Get the legacy PIP window size"
        parameters: []
        response:
          type: string
          schema:
            size: integer
    pip_position:
      set:
        command: "SET VIDOUT_PIP_POS"
        syntax: "SET VIDOUT_PIP_POS <0|1|2|3>"
        description: "Set the legacy PIP window position"
        parameters:
          - position
        response:
          type: confirmation
          schema:
            position: integer
      get:
        command: "GET VIDOUT_PIP_POS"
        syntax: "GET VIDOUT_PIP_POS"
        description: "Get the legacy PIP window position"
        parameters: []
        response:
          type: string
          schema:
            position: integer

  legacy_videowall:
    wall_map:
      set:
        command: "SET VIDWALL"
        syntax: "SET VIDWALL <input> <top_left> <top_right> <bottom_left> <bottom_right>"
        description: "Set the legacy videowall source and output tile map"
        parameters:
          - input
          - top_left
          - top_right
          - bottom_left
          - bottom_right
        response:
          type: confirmation
          schema:
            mapping: string
      get:
        command: "GET VIDWALL"
        syntax: "GET VIDWALL"
        description: "Get the legacy videowall source and output tile map"
        parameters: []
        response:
          type: string
          schema:
            mapping: string
    mode:
      set:
        command: "SET VIDMODE"
        syntax: "SET VIDMODE <Matrix|VideoWall|MultiView>"
        description: "Set the legacy global video mode"
        parameters:
          - mode
        response:
          type: confirmation
          schema:
            mode: string
      get:
        command: "GET VIDMODE"
        syntax: "GET VIDMODE"
        description: "Get the legacy global video mode"
        parameters: []
        response:
          type: string
          schema:
            mode: string
    bezel:
      set:
        command: "SET VIDWALLBEZEL"
        syntax: "SET VIDWALLBEZEL <vw> <ow> <vh> <oh>"
        description: "Set the legacy videowall bezel compensation values"
        parameters:
          - view_width
          - outer_width
          - view_height
          - outer_height
        response:
          type: confirmation
          schema:
            bezel: string
      get:
