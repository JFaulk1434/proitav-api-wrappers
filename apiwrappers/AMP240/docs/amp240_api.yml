module: amp240
description: AMP-240-000 telnet API commands

schema:
  command:
    required:
      - command
      - syntax
      - description
      - response
    properties:
      command: string
      syntax: string
      description: string
      parameters: list
      response:
        type: string
        schema: object

commands:
  dsp_mix:
    set:
      command: "SET DSP_MIX"
      syntax: "SET DSP_MIX <out_port> <in_port> <value>"
      description: "Set DSP matrix crosspoint state."
      parameters: [out_port, in_port, value]
      response:
        type: string
        schema: {}
    get:
      command: "GET DSP_MIX"
      syntax: "GET DSP_MIX <out_port> <in_port>"
      description: "Get DSP matrix crosspoint state."
      parameters: [out_port, in_port]
      response:
        type: string
        schema: {}

  dsp_exp:
    set:
      command: "SET DSP_EXP"
      syntax: "SET DSP_EXP <port> <value>"
      description: "Set DSP expander status."
      parameters: [port, value]
      response: { type: string, schema: {} }
    get:
      command: "GET DSP_EXP"
      syntax: "GET DSP_EXP <port>"
      description: "Get DSP expander status."
      parameters: [port]
      response: { type: string, schema: {} }

  dsp_exp_prop:
    set:
      command: "SET DSP_EXP_PROP"
      syntax: "SET DSP_EXP_PROP <field_id> <port> <value>"
      description: "Set DSP expander properties."
      parameters: [field_id, port, value]
      response: { type: string, schema: {} }
    get:
      command: "GET DSP_EXP_PROP"
      syntax: "GET DSP_EXP_PROP <field_id> <port>"
      description: "Get DSP expander properties."
      parameters: [field_id, port]
      response: { type: string, schema: {} }

