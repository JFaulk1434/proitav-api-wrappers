<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background-color: black;
            color: white;
        }

        .power-switch {
            position: relative;
            display: inline-block;
            width: 100px;
            height: 40px;
        }

        .power-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 40px;
            border: 2px solid #444;
        }

        .slider:before {
            position: absolute;
            content: "⏻";
            /* Unicode power symbol */
            height: 32px;
            width: 32px;
            left: 4px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 20px;
        }

        input:checked+.slider {
            background-color: #2196F3;
        }

        input:checked+.slider:before {
            transform: translateX(60px);
            background-color: white;
            color: #2196F3;
        }

        .slider:after {
            content: 'OFF';
            position: absolute;
            right: 12px;
            top: 10px;
            color: white;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        input:checked+.slider:after {
            content: 'ON';
            left: 12px;
            right: auto;
        }
    </style>
</head>

<body>
    <h2>Power Toggle Switch</h2>
    <label class="power-switch">
        <input type="checkbox">
        <span class="slider"></span>
    </label>
</body>

</html>
